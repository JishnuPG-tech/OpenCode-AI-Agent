app = "opencode-jump"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# HTTP service — UptimeRobot pings this to prevent sleep
[[services]]
  internal_port = 8080
  protocol     = "tcp"

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [services.http_checks]
    interval = 10000
    timeout  = 2000

# SSH service — two external ports point to sshd (22)
# Port 22  : HF Space dials in to create the reverse tunnel
# Port 2222: Termius connects through to reach HF Space sshd
[[services]]
  internal_port = 22
  protocol      = "tcp"

  [[services.ports]]
    port = 22

  [[services.ports]]
    port = 2222
